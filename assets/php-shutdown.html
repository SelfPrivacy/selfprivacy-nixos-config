<!DOCTYPE html>
<!-- Inspired by the GrapheneOS discussion forum's temporary shutdown page. -->
<html>
  <head>
    <meta charset="utf-8">

    <title>PHP services temporarily unavailable</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1">

    <style>
      * {
       box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        font-size: 18px;
        text-align: center;
        line-height: 1.5;
        color: #333;
      }
      input,
      button,
      select,
      textarea {
        font-family: inherit;
        font-size: inherit;
        line-height: inherit;
      }
      a {
        cursor: pointer;
        color: #0d6efd;
        text-decoration: none;
        font-weight: bold;
      }
      a:hover {
        text-decoration: underline;
        color: #094db1;
      }
      .container {
        margin: 100px auto;
        max-width: 600px;
        padding: 0 15px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <p>We have temporarily disabled SelfPrivacy services that use PHP due to critical vulnerabilities in PHP. See the <a href="https://www.php.net/archive/2026.php#2026-10-20-1">PHP advisory</a>.</p>
      <p>Other services are unaffected. If you have questions, contact <a href="https://matrix.to/#/#chat:selfprivacy.org">SelfPrivacy on Matrix</a> or <a href="https://t.me/selfprivacy_chat">SelfPrivacy on Telegram</a>.</p>
    </div>
  </body>
</html>
